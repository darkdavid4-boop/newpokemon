spring:
  application:
    name: pokemon-api

# Configuración del servidor
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Configuración OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

services:
  pokemon-catalog:
    base-url: ${POKEMON_CATALOG_URL:http://localhost:8082}
  type-catalog:
    base-url: ${TYPE_CATALOG_URL:http://localhost:8081}
