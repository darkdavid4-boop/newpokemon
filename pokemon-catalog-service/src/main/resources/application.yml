spring:
  application:
    name: pokemon-catalog-service
  datasource:
    url: jdbc:h2:mem:pokemoncatalogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
server:
  port: ${SERVER_PORT:8082}
  address: ${SERVER_ADDRESS:127.0.0.1}
services:
  type-catalog:
    base-url: ${TYPE_CATALOG_URL:http://localhost:8081}
